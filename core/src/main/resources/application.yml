server:
  port: 8080

apache:
  gemini:
    # IMPORTANTE: no subir vuestra API key real a git.
    # En un entorno real esto se lee de una variable de entorno.
    api-key: ${GEMINI_API_KEY:PON_AQUI_TU_API_KEY}
    model: gemini-3.1-flash-lite

    voice:
      # Modelo, voz y frecuencia de muestreo usados para la síntesis de voz (TTS).
      tts-model: gemini-2.5-flash-preview-tts
      tts-voice-name: Kore
      tts-sample-rate: 24000

  db:
    # Apache 0.1 utiliza MySQL como base de datos principal.
    url: jdbc:mysql://localhost:3306/apache
    driver: com.mysql.cj.jdbc.Driver
    username: root
    password: root

logging:
  level:
    com.apache: DEBUG