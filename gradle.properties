# Memoria para Gradle y codificación UTF-8 (evita las tildes rotas tipo "instrucci├│n"
# en los mensajes del compilador).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Compila Kotlin dentro del proceso de Gradle en lugar de en un "Kotlin daemon"
# aparte. En Windows, los daemons que quedan colgados ("Detected multiple Kotlin
# daemon sessions") dejaban la caché incremental a medias (.class de 0 bytes).
kotlin.compiler.execution.strategy=in-process
